contractVersion: tunnel-recipe.v1
recipeId: com.opute.cloudflare.tunneling.managed
recipeVersion: 1.2.0
provider:
  id: com.opute.cloudflare
  capabilities: [tunneling]
bindings:
  - id: local-service
    hostname: "${vars.inputs.hostname}"
    localTarget: "${vars.inputs.localTarget}"
inputs:
  bindingId:
    required: true
    schema: {type: string, minLength: 1, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,254}$'}
  endpoint:
    required: true
    schema: {type: string, format: uri}
  hostname:
    required: true
    schema: {type: string, minLength: 1, maxLength: 253}
  localTarget:
    required: true
    schema: {type: string, format: uri}
  tunnelToken:
    required: true
    secret: true
    schema: {type: string, minLength: 32}
  artifactUri:
    default: https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/cloudflared-linux-amd64
    schema: {type: string, format: uri}
  artifactSha256:
    default: fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2
    schema: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
  scope:
    default: user
    schema: {type: string, enum: [user, system]}
  recipeRevision:
    default: 1.2.0
    schema: {type: string, pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+$'}
compatibility:
  requiredTools: [ensure_public_mcp_tunnel, probe_http_endpoint, opute.capability.tunneling.probe-host-tunnel]
activation:
  capability: tunneling
  servingContract: mcp-exposure.v1
  inputBindings:
    endpoint: endpoint
plan:
  contractVersion: host-plan.v1
  planId: com.opute.cloudflare.tunneling.managed
  generation: 1
  idempotencyKey: com.opute.cloudflare.managed-${vars.inputs.recipeRevision}-${vars.inputs.artifactSha256}-${vars.inputs.endpoint}-${vars.inputs.hostname}-${vars.inputs.bindingId}
  nodes:
    - id: public-mcp
      action:
        tool: ensure_public_mcp_tunnel
        args:
          bindingId: "${vars.inputs.bindingId}"
          endpoint: "${vars.inputs.endpoint}"
          localTarget: "${vars.inputs.localTarget}"
          tunnelToken: "${vars.inputs.tunnelToken}"
          artifactUri: "${vars.inputs.artifactUri}"
          artifactSha256: "${vars.inputs.artifactSha256}"
          scope: "${vars.inputs.scope}"
      validate:
        tool: probe_http_endpoint
        args:
          endpoint: "${vars.inputs.endpoint}"
          acceptAuthenticationChallenge: true
        assert: [{path: /ready, op: eq, value: true}]
    - id: provider-routing
      dependsOn: [public-mcp]
      action:
        tool: opute.capability.tunneling.probe-host-tunnel
        args:
          bindingId: "${vars.inputs.bindingId}"
          hostname: "${vars.inputs.hostname}"
          localTarget: "${vars.inputs.localTarget}"
          placement: host
      validate:
        tool: opute.capability.tunneling.probe-host-tunnel
        args:
          bindingId: "${vars.inputs.bindingId}"
          hostname: "${vars.inputs.hostname}"
          localTarget: "${vars.inputs.localTarget}"
          placement: host
        assert: [{path: /ready, op: eq, value: true}]
