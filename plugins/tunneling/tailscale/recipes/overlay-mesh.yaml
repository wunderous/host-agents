contractVersion: host-recipe.v1
recipeId: com.opute.tailscale.overlay-mesh
recipeVersion: 1.0.2
execution:
  coordinator: host-agent
  mode: local
compatibility:
  requiredTools:
    - get_host_info
    - opute.capability.network-overlay.enroll
    - opute.capability.network-overlay.ensure-private-mesh
    - opute.capability.network-overlay.probe
inputs:
  targetUri:
    required: true
    schema: {type: string, minLength: 1}
  peerTargetUri:
    required: true
    schema: {type: string, minLength: 1}
  peerMeshIp:
    required: true
    schema: {type: string, format: ipv4}
  name:
    required: true
    schema: {type: string, minLength: 1}
plan:
  contractVersion: host-plan.v1
  planId: com.opute.tailscale.overlay-mesh
  generation: 1
  idempotencyKey: com.opute.tailscale.overlay-mesh-${vars.inputs.targetUri}-v2
  nodes:
    - id: agent
      action:
        tool: get_host_info
    - id: enroll
      dependsOn: [agent]
      action:
        tool: opute.capability.network-overlay.enroll
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
          name: ${vars.inputs.name}
          credentialKind: auth-key
      validate:
        tool: opute.capability.network-overlay.probe
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
          pathClass: private-mesh
        assert:
          - {path: /ready, op: eq, value: true}
        pollIntervalMs: 2000
        timeoutMs: 180000
    - id: mesh
      dependsOn: [enroll]
      action:
        tool: opute.capability.network-overlay.ensure-private-mesh
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
          membershipRef: ${nodes.enroll.output.membershipRef}
          peerTargetUri: ${vars.inputs.peerTargetUri}
          peerMeshIp: ${vars.inputs.peerMeshIp}
          credentialKind: auth-key
      validate:
        tool: opute.capability.network-overlay.probe
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
          peerMeshIp: ${vars.inputs.peerMeshIp}
          pathClass: private-mesh
        assert:
          - {path: /ready, op: eq, value: true}
        pollIntervalMs: 2000
        timeoutMs: 180000
    - id: probe
      dependsOn: [mesh]
      action:
        tool: opute.capability.network-overlay.probe
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
          peerMeshIp: ${vars.inputs.peerMeshIp}
          pathClass: private-mesh
