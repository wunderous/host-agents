contractVersion: host-recipe.v1
recipeId: com.opute.tailscale.overlay-mesh
recipeVersion: 1.0.0
execution:
  coordinator: host-agent
  mode: local
compatibility:
  requiredTools:
    - opute.capability.network-overlay.validate
    - opute.capability.network-overlay.enroll
    - opute.capability.network-overlay.ensure-private-mesh
    - opute.capability.network-overlay.probe
inputs:
  targetUri:
    required: true
    schema: {type: string, minLength: 1}
  peerTargetUri:
    required: true
    schema: {type: string, minLength: 1}
  peerMeshIp:
    required: true
    schema: {type: string, format: ipv4}
  name:
    required: true
    schema: {type: string, minLength: 1}
plan:
  contractVersion: host-plan.v1
  planId: com.opute.tailscale.overlay-mesh
  generation: 1
  idempotencyKey: com.opute.tailscale.overlay-mesh-${vars.inputs.targetUri}
  nodes:
    - id: validate
      action:
        tool: opute.capability.network-overlay.validate
        args:
          targetUri: ${vars.inputs.targetUri}
          credentialKind: auth-key
    - id: enroll
      dependsOn: [validate]
      action:
        tool: opute.capability.network-overlay.enroll
        args:
          targetUri: ${vars.inputs.targetUri}
          name: ${vars.inputs.name}
          credentialKind: auth-key
    - id: mesh
      dependsOn: [enroll]
      action:
        tool: opute.capability.network-overlay.ensure-private-mesh
        args:
          targetUri: ${vars.inputs.targetUri}
          peerTargetUri: ${vars.inputs.peerTargetUri}
          peerMeshIp: ${vars.inputs.peerMeshIp}
    - id: probe
      dependsOn: [mesh]
      action:
        tool: opute.capability.network-overlay.probe
        args:
          targetUri: ${vars.inputs.targetUri}
          peerMeshIp: ${vars.inputs.peerMeshIp}
          pathClass: private-mesh
