contractVersion: host-recipe.v1
recipeId: com.opute.tailscale.ha-network-bundle
recipeVersion: 1.0.0
execution:
  coordinator: host-agent
  mode: local
compatibility:
  requiredTools:
    - get_host_info
    - opute.capability.mesh-runtime.ensure-agent
    - opute.capability.mesh-runtime.ensure-control-plane
    - opute.capability.mesh-runtime.status
    - opute.capability.mesh-membership.enroll
    - opute.capability.private-mesh.ensure
    - opute.capability.public-ingress.ensure
    - opute.capability.private-mesh.probe
    - opute.capability.public-ingress.probe
inputs:
  targetUri:
    required: true
    schema: {type: string, minLength: 1}
  peerTargetUri:
    required: true
    schema: {type: string, minLength: 1}
  peerMeshIp:
    required: true
    schema: {type: string, format: ipv4}
  name:
    required: true
    schema: {type: string, minLength: 1}
  localTarget:
    required: true
    schema: {type: string, format: uri}
  operatorMode:
    default: true
    schema: {type: boolean}
  ingressClassName:
    default: tailscale
    schema: {type: string}
  operatorEvidence:
    default: ""
    schema: {type: string}
  hostname:
    default: ""
    schema: {type: string}
  endpoint:
    default: ""
    schema: {type: string}
  publicHosts:
    default: ["www.opute.io", "opute.io"]
    schema:
      type: array
      items: {type: string}
plan:
  contractVersion: host-plan.v1
  planId: com.opute.tailscale.ha-network-bundle
  generation: 1
  idempotencyKey: com.opute.tailscale.ha-network-bundle-${vars.inputs.targetUri}-v1
  nodes:
    - id: agent
      action:
        tool: get_host_info
    - id: runtime-agent
      dependsOn: [agent]
      action:
        tool: opute.capability.mesh-runtime.ensure-agent
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
      validate:
        tool: opute.capability.mesh-runtime.status
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
        assert:
          - {path: /agentReady, op: eq, value: true}
        pollIntervalMs: 2000
        timeoutMs: 300000
    - id: runtime-control-plane
      dependsOn: [runtime-agent]
      action:
        tool: opute.capability.mesh-runtime.ensure-control-plane
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
          operatorMode: ${vars.inputs.operatorMode}
          ingressClassName: ${vars.inputs.ingressClassName}
          operatorEvidence: ${vars.inputs.operatorEvidence}
      validate:
        tool: opute.capability.mesh-runtime.status
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
        assert:
          - {path: /controlPlaneReady, op: eq, value: true}
        pollIntervalMs: 2000
        timeoutMs: 180000
    - id: enroll
      dependsOn: [runtime-control-plane]
      action:
        tool: opute.capability.mesh-membership.enroll
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
          name: ${vars.inputs.name}
          credentialKind: auth-key
      validate:
        tool: opute.capability.mesh-membership.status
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
        assert:
          - {path: /ready, op: eq, value: true}
        pollIntervalMs: 2000
        timeoutMs: 180000
    - id: mesh
      dependsOn: [enroll]
      action:
        tool: opute.capability.private-mesh.ensure
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
          membershipRef: ${nodes.enroll.output.membershipRef}
          peerTargetUri: ${vars.inputs.peerTargetUri}
          peerMeshIp: ${vars.inputs.peerMeshIp}
          credentialKind: auth-key
      validate:
        tool: opute.capability.private-mesh.probe
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
          peerMeshIp: ${vars.inputs.peerMeshIp}
        assert:
          - {path: /ready, op: eq, value: true}
        pollIntervalMs: 2000
        timeoutMs: 180000
    - id: ingress
      dependsOn: [mesh]
      action:
        tool: opute.capability.public-ingress.ensure
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
          localTarget: ${vars.inputs.localTarget}
          membershipRef: ${nodes.enroll.output.membershipRef}
          operatorMode: ${vars.inputs.operatorMode}
          ingressClassName: ${vars.inputs.ingressClassName}
          operatorEvidence: ${vars.inputs.operatorEvidence}
          hostname: ${vars.inputs.hostname}
          endpoint: ${vars.inputs.endpoint}
      validate:
        tool: opute.capability.public-ingress.probe
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
        assert:
          - {path: /ready, op: eq, value: true}
          - {path: /stable, op: eq, value: true}
        pollIntervalMs: 3000
        timeoutMs: 180000
    - id: probe
      dependsOn: [ingress]
      action:
        tool: opute.capability.public-ingress.probe
        args:
          hostAgentId: ${nodes.agent.output.agent.agentId}
          targetUri: ${vars.inputs.targetUri}
