name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test-all-modules

      - name: OpenRouter Granite 4.2 smoke
        id: openrouter-granite42
        # Keep release artifacts buildable when OpenRouter temporarily has no
        # endpoint for the exact acceptance model. The smoke failure remains
        # visible as a blocked probe and is not reported as a pass.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: make openrouter-llm-smoke

      - name: Report blocked OpenRouter Granite 4.2 smoke
        if: steps.openrouter-granite42.outcome == 'failure'
        run: echo "::warning::OpenRouter Granite 4.2 smoke is BLOCKED; the exact model was unavailable or not ready."

      - name: Build release artifacts
        id: release_version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            version="dev-${GITHUB_SHA::12}"
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            package_version=$(node -p "require('./npm/local-host-agent/package.json').version")
            test "$package_version" = "$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          make artifacts VERSION="$version"

      - name: Prepare x64 standalone smoke binary
        run: gzip -dc dist/host-agent-linux-x64.gz > dist/host-agent-linux-x64

      - name: Generate release checksums
        run: (cd dist && sha256sum host-agent-linux-x64 host-agent-linux-x64.gz host-agent-linux-arm64.gz host-agent-windows-x64.gz opute-provider-k3s-linux-x64 opute-provider-cloudflare-linux-x64 opute-provider-tailscale-linux-x64 > SHA256SUMS)

      - name: Verify release checksums
        run: (cd dist && sha256sum -c SHA256SUMS)

      - name: Verify npm tarball read-only path
        if: startsWith(github.ref, 'refs/tags/v')
        run: make local-npm-readonly-canary VERSION=$(node -p "require('./npm/local-host-agent/package.json').version")

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Standalone Streamable HTTP smoke
        run: OPUTE_STANDALONE_BINARY="${{ github.workspace }}/dist/host-agent-linux-x64" go test ./test/standalone -count=1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: host-agent-binaries
          if-no-files-found: error
          path: |
            dist/host-agent-linux-x64.gz
            dist/host-agent-linux-x64
            dist/host-agent-linux-arm64.gz
            dist/host-agent-windows-x64.gz
            dist/opute-provider-k3s-linux-x64
            dist/opute-provider-cloudflare-linux-x64
            dist/opute-provider-tailscale-linux-x64
            dist/SHA256SUMS
            dist/sbom.spdx.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: host-agent-binaries
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/host-agent-linux-x64.gz
            dist/host-agent-linux-x64
            dist/host-agent-linux-arm64.gz
            dist/host-agent-windows-x64.gz
            dist/opute-provider-k3s-linux-x64
            dist/opute-provider-cloudflare-linux-x64
            dist/opute-provider-tailscale-linux-x64
            dist/SHA256SUMS
            dist/sbom.spdx.json
          generate_release_notes: true

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

  npm:
    if: startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success'
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Test and publish npm launcher
        working-directory: npm/local-host-agent
        run: |
          npm test
          version="$(node -p "require('./package.json').version")"
          package="@opute/host-agent"
          test "v$version" = "$GITHUB_REF_NAME"
          registry="https://registry.npmjs.org"
          existing_version="$(npm view "$package@$version" version --registry="$registry" 2>/dev/null || true)"
          if [[ "$existing_version" == "$version" ]]; then
            existing_git_head="$(npm view "$package@$version" gitHead --registry="$registry" 2>/dev/null || true)"
            if [[ "$existing_git_head" != "$GITHUB_SHA" ]]; then
              echo "published package version exists for a different source revision"
              exit 1
            fi
            echo "published package already matches this source revision; resuming canary"
          else
            npm publish --access public --provenance
          fi
          visible=false
          # npm confirms uploads before every registry edge serves their metadata.
          for attempt in $(seq 1 30); do
            published_version="$(npm view "$package@$version" version --registry="$registry" 2>/dev/null || true)"
            if [[ "$published_version" == "$version" ]]; then
              published_git_head="$(npm view "$package@$version" gitHead --registry="$registry" 2>/dev/null || true)"
              if [[ "$published_git_head" != "$GITHUB_SHA" ]]; then
                echo "published package source revision does not match this release"
                exit 1
              fi
              visible=true
              break
            fi
            sleep 10
          done
          if [[ "$visible" != true ]]; then
            echo "published npm package did not become visible"
            exit 1
          fi
          canary_passed=false
          for attempt in 1 2 3 4 5 6 7 8; do
            if RUN_PUBLISHED_READONLY_NPM_CANARY=true \
              PUBLISHED_NPM_VERSION="$version" \
              PUBLISHED_CANARY_SOURCE_SHA="$GITHUB_SHA" \
              PUBLISHED_CANARY_RUN_ID="$GITHUB_RUN_ID" \
              PUBLISHED_CANARY_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              PUBLISHED_CANARY_EVIDENCE_OUTPUT=published-readonly-canary-evidence.json \
              node --test published-readonly-canary.test.js; then
              canary_passed=true
              break
            fi
            if [[ "$attempt" != "8" ]]; then
              echo "published-package canary attempt $attempt failed; retrying registry and binary access"
              sleep 10
            fi
          done
          if [[ "$canary_passed" != true ]]; then
            echo "published-package read-only canary did not pass"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload published read-only canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: published-readonly-canary-evidence
          if-no-files-found: error
          retention-days: 90
          path: npm/local-host-agent/published-readonly-canary-evidence.json
