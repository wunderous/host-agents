name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 -- .golangci.yml's new-from-rev baseline needs history.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # Ratcheted lint. .golangci.yml pins a baseline rev so today's 50
      # pre-existing issues are reported but do not fail; anything NEW does.
      # See .agents/plans/2026-08-27-modular-cordis-architecture.md S7.5.
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          # new-from-rev needs history to diff against the baseline commit.
          args: --timeout=5m

      - name: Test
        run: go test ./...

      - name: Test npm launcher
        working-directory: npm/local-host-agent
        run: npm test

      - name: Build release artifacts
        run: make artifacts

      - name: Verify artifact outputs
        run: |
          test -f dist/host-agent-linux-x64.gz
          test -f dist/host-agent-linux-arm64.gz
          gzip -t dist/host-agent-linux-x64.gz
          gzip -t dist/host-agent-linux-arm64.gz
          gzip -dc dist/host-agent-linux-x64.gz > dist/host-agent-linux-x64
          sha256sum dist/host-agent-linux-x64.gz dist/host-agent-linux-arm64.gz > dist/SHA256SUMS
          test -s dist/SHA256SUMS

      - name: Standalone Streamable HTTP smoke
        run: OPUTE_STANDALONE_BINARY="${{ github.workspace }}/dist/host-agent-linux-x64" go test ./test/standalone -count=1
