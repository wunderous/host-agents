name: Publish site image

on:
  push:
    branches: [main]
    paths:
      - site/**
      - README.md
      - docs/**
      - npm/local-host-agent/**
      - cmd/opute-host-agent/**
      - contracts/**
      - internal/**
      - plugins/**
      - schemas/**
      - catalog-meta.json
      - go.mod
      - go.sum
      - Makefile
      - scripts/*site*
      - .github/workflows/publish-site-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'wunderous/host-agents' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Verify generated site and published-package behavior
        run: |
          make check-site

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write public build marker
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          marker = {
              "sourceSha": os.environ["SOURCE_SHA"],
              "runId": int(os.environ["RUN_ID"]),
              "runAttempt": int(os.environ["RUN_ATTEMPT"]),
          }
          Path("site/public/build.json").write_text(
              json.dumps(marker, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build and publish
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./site
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/wunderous/host-agent-www:sha-${{ github.sha }}
            ghcr.io/wunderous/host-agent-www:run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/wunderous/host-agents
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest published image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/wunderous/host-agent-www
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Record image identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "Image: ghcr.io/wunderous/host-agent-www@$IMAGE_DIGEST"
            echo "Source: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"
