<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Opute Host Agent</title>
  <desc id="description">An authenticated MCP client reads typed host facts through Opute Host Agent on Linux.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1210" />
      <stop offset="1" stop-color="#14201c" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72d6a2" />
      <stop offset="1" stop-color="#3d9b6e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#background)" />
  <circle cx="1030" cy="88" r="220" fill="#3d9b6e" opacity="0.12" />
  <path d="M0 510C250 420 450 680 760 535s320-70 440-120v215H0z" fill="#3d9b6e" opacity="0.08" />
  <g font-family="system-ui,Segoe UI,sans-serif" fill="#e8f0ea">
    <text x="90" y="113" font-size="24" font-weight="700" letter-spacing="4" fill="#72d6a2">OPUTE HOST AGENT</text>
    <text x="90" y="235" font-size="58" font-weight="700">Inspect Linux hosts</text>
    <text x="90" y="307" font-size="58" font-weight="700">through an authenticated</text>
    <text x="90" y="379" font-size="58" font-weight="700">MCP client.</text>
    <text x="90" y="441" font-size="25" fill="#9bb0a3">Typed host facts and capabilities, with explicit effects.</text>
  </g>
  <g transform="translate(90 492)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <rect width="760" height="80" rx="10" fill="#080d0b" stroke="#3d9b6e" stroke-opacity="0.7" />
    <circle cx="27" cy="25" r="6" fill="#72d6a2" />
    <text x="52" y="32" font-size="18" fill="#9bb0a3">read-only</text>
    <text x="28" y="60" font-size="21" fill="#cfe8d8">get_host_info {}</text>
  </g>
</svg>
