# Ownership-scoped teardown for the www.opute.io Host Agent docs site.
#
# Removes only generation-owned resources:
# - dedicated tunnel + CNAME for www.opute.io (opute-www-opute-io)
# - connector namespace host-agent-www-tunnel
# - workload namespace host-agent-site
#
# MUST NOT touch opute-platform, platform-opute ingress, or
# opute-platform-opute-io (platform.opute.io / mcp.opute.io).
contractVersion: host-recipe.v1
recipeId: com.opute.host-agent.docs-site.www.teardown
recipeVersion: 1.0.0
execution:
  coordinator: host-agent
  mode: local
compatibility:
  requiredTools:
    - opute.capability.tunneling.remove-host-tunnel
    - opute.capability.tunneling.delete-kubernetes-connector
    - delete_k8s_resource
    - probe_http_endpoint
inputs:
  host:
    required: true
    schema: {type: string, minLength: 1}
  clusterUri:
    required: true
    schema: {type: string, minLength: 1, pattern: '^cluster:[a-z][a-z0-9-]{0,31}:.+$'}
  hostname:
    default: www.opute.io
    schema: {type: string, minLength: 1, maxLength: 253}
  hostnames:
    default: ["www.opute.io", "opute.io"]
    schema:
      type: array
      minItems: 1
      items: {type: string, minLength: 1, maxLength: 253}
  tunnelName:
    default: opute-www-opute-io
    schema: {type: string, minLength: 1, maxLength: 253}
  bindingId:
    default: www-opute-io
    schema: {type: string, minLength: 1}
  localTarget:
    default: http://host-agent-www.host-agent-site.svc.cluster.local:80
    schema: {type: string, format: uri}
  connectorNamespace:
    default: host-agent-www-tunnel
    schema: {type: string, minLength: 1}
  workloadNamespace:
    default: host-agent-site
    schema: {type: string, minLength: 1}
  platformOrigin:
    default: https://platform.opute.io/
    schema: {type: string, format: uri}
plan:
  contractVersion: host-plan.v1
  planId: com.opute.host-agent.docs-site.www.teardown
  generation: 1
  idempotencyKey: com.opute.host-agent.docs-site.www.teardown-${vars.inputs.hostname}-${vars.inputs.tunnelName}
  defaults:
    timeoutMs: 600000
  nodes:
    - id: unpublish
      target:
        hostRef: ${vars.inputs.host}
      action:
        tool: opute.capability.tunneling.remove-host-tunnel
        args:
          bindingId: ${vars.inputs.bindingId}
          hostname: ${vars.inputs.hostname}
          hostnames: ${vars.inputs.hostnames}
          tunnelName: ${vars.inputs.tunnelName}
          localTarget: ${vars.inputs.localTarget}
          placement: kubernetes
    - id: delete-connector
      dependsOn: [unpublish]
      target:
        hostRef: ${vars.inputs.host}
      action:
        tool: opute.capability.tunneling.delete-kubernetes-connector
        args:
          targetUri: ${vars.inputs.clusterUri}
          namespace: ${vars.inputs.connectorNamespace}
          placement: kubernetes
    - id: delete-workload
      dependsOn: [delete-connector]
      target:
        hostRef: ${vars.inputs.host}
      action:
        tool: delete_k8s_resource
        args:
          uri: ${vars.inputs.clusterUri}
          kind: Namespace
          resourceName: ${vars.inputs.workloadNamespace}
    - id: prove-platform
      dependsOn: [delete-workload]
      target:
        hostRef: ${vars.inputs.host}
      action:
        tool: probe_http_endpoint
        args:
          endpoint: ${vars.inputs.platformOrigin}
      validate:
        tool: probe_http_endpoint
        args:
          endpoint: ${vars.inputs.platformOrigin}
        assert:
          - path: /ready
            op: eq
            value: true
